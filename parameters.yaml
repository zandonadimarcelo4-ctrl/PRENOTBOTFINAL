# =====================================================================
#  PrenotaBot - configuracao
# =====================================================================

# Tipo de servico: "passport" (passaporte) ou "citizenship" (cidadania)
request_type: "passport"

# ID do servico no Prenot@mi (o numero no fim do link .../Services/Booking/XXXX).
# Cada consulado tem IDs diferentes! Confira clicando em "Prenota" no site
# e copiando o numero da barra de endereco.
service_ids:
  passport: 1319
  citizenship: 2392

# Intervalo aleatorio entre verificacoes (segundos). Minimo aceito: 20.
# Intervalos curtos demais podem bloquear sua conta.
intervalo_min_segundos: 45
intervalo_max_segundos: 90

# Quantas verificacoes no maximo (0 = sem limite, ate voce apertar Ctrl+C)
max_tentativas: 0

# Guarda a sessao do Chrome na pasta chrome_profile (evita logar toda vez)
usar_perfil_persistente: true

# Se o login automatico falhar (captcha), pausa para voce logar manualmente
login_manual_se_falhar: true

# Clicar em "Avanti" automaticamente depois de preencher o formulario
clicar_avancar: true

# Documentos na pasta files/, na ordem dos campos de upload (File_0, File_1...)
documentos:
  passport:
    - identidade.pdf
    - residencia.pdf
  citizenship:
    - residencia.pdf

# Campos do formulario. "valor" deve ser o texto que aparece no site
# (Yes/No, Si/No ou Sim/Nao sao reconhecidos automaticamente).
# Deixe valor vazio ("") para preencher aquele campo manualmente.
campos:
  passport:
    - id: ddls_0
      descricao: "Possui passaporte vencido?"
      tipo: select
      valor: "No"
    - id: ddls_1
      descricao: "Tem filhos menores de idade?"
      tipo: select
      valor: "No"
    - id: DatiAddizionaliPrenotante_2___testo
      descricao: "Quantidade de filhos"
      tipo: texto
      valor: "0"
    - id: DatiAddizionaliPrenotante_3___testo
      descricao: "Endereco completo"
      tipo: texto
      valor: "Av Maria Soares de Paiva 233, Sagrada Familia, CEP 78735-268"
    - id: ddls_4
      descricao: "Estado civil"
      tipo: select
      valor: ""   # ex.: "Single", "Married", "Celibe/Nubile", "Coniugato/a"
  citizenship: []
